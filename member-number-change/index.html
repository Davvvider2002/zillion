<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Change your wallet number — Zillion</title>
<style>
  :root { --bg: #05140D; --card: #0F2B1D; --border: #1A4030; --border2: #234A38; --text: #E8F5EE; --muted: #9CC4B0; --muted2: #7A9A85; --amber: #E8930C; --green2: #00E0AC; --red: #FF8A8A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 32px 20px; }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo .z { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: var(--amber); color: #1A2E1A; font-weight: 800; font-size: 20px; border-radius: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
  label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted2); margin-bottom: 6px; }
  input, textarea { width: 100%; padding: 12px; background: #081A11; border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 15px; margin-bottom: 14px; font-family: inherit; }
  textarea { min-height: 84px; resize: vertical; }
  .row { display: flex; gap: 8px; }
  .row input { margin-bottom: 14px; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; background: var(--amber); color: #1A2E1A; }
  .btn.alt { background: transparent; border: 1px solid var(--border2); color: var(--muted); width: auto; padding: 12px 14px; font-size: 13px; white-space: nowrap; }
  .btn:disabled { opacity: .55; cursor: default; }
  .msg { font-size: 13px; margin: 0 0 12px; display: none; line-height: 1.45; }
  .msg.err { color: var(--red); } .msg.good { color: var(--green2); }
  .note { background: #081A11; border: 1px solid var(--border2); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
  .note b { color: var(--amber); }
  .files { font-size: 13px; color: var(--muted); margin: -6px 0 14px; }
  .files div { padding: 3px 0; }
  .center { text-align: center; padding: 18px 0; }
  .big { font-size: 44px; margin-bottom: 8px; }
  .foot { text-align: center; font-size: 11px; color: var(--muted2); margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><span class="z">Z</span></div>
  <div class="card" id="card"><div class="center" style="color:var(--muted);font-size:13px">Loading…</div></div>
  <div class="foot">Powered by Zillion Coop</div>
</div>

<script>
const API = '/.netlify/functions';
const token = new URLSearchParams(location.search).get('t') || '';
let info = null, otpSent = false, otpPhone = '';

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
const $ = id => document.getElementById(id);
function show(id, text, kind) { const e = $(id); if (!e) return; e.textContent = text; e.className = 'msg ' + (kind || 'err'); e.style.display = text ? 'block' : 'none'; }
function card(html) { $('card').innerHTML = html; }

async function call(path, method, body) {
  const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  let data = {}; try { data = await res.json(); } catch {}
  return { ok: res.ok, data };
}

async function init() {
  if (!token) return card('<div class="center"><div class="big">⚠️</div><h1>Link not valid</h1><div class="sub">Open the link exactly as Zillion sent it.</div></div>');
  const r = await call(`${API}/member-phone-change?t=${encodeURIComponent(token)}`, 'GET');
  if (!r.ok) return card('<div class="center"><div class="big">⚠️</div><h1>Link not valid</h1><div class="sub">' + esc(r.data.error || 'This link does not work. Ask Zillion support for a new one.') + '</div></div>');
  info = r.data; render();
}

function filesHtml() {
  return (info.proof || []).length ? '<div class="files">' + info.proof.map(p => '<div>📎 ' + esc(p.name) + '</div>').join('') + '</div>' : '';
}

function render() {
  const s = info.state;
  if (s === 'EXPIRED') return card('<div class="center"><div class="big">⌛</div><h1>This link has expired</h1><div class="sub">Ask Zillion support to send you a new one.</div></div>');
  if (s === 'SUBMITTED') return card('<div class="center"><div class="big">📨</div><h1>With Zillion for review</h1><div class="sub">We have your request. Nothing changes on your wallet until it is approved. Zillion will contact you.</div></div>');
  if (s === 'APPROVED') return card('<div class="center"><div class="big">✅</div><h1>Number changed</h1><div class="sub">Sign in to your wallet with ' + esc(info.new_phone) + '.</div></div>');
  if (s === 'REJECTED') return card('<div class="center"><div class="big">🚫</div><h1>Request not approved</h1><div class="sub">' + esc(info.staff_note || 'Contact Zillion support for more detail.') + '</div></div>');
  if (s === 'CANCELLED') return card('<div class="center"><div class="big">🚫</div><h1>Request closed</h1><div class="sub">Contact Zillion support if you still need a change.</div></div>');

  const more = s === 'MORE_PROOF_REQUESTED';
  card(`
    <h1>Change your wallet number</h1>
    <div class="sub">${esc(info.member_name || 'Member')}${info.society ? ' · ' + esc(info.society) : ''}<br>Current number: ${esc(info.old_phone_masked)}</div>
    ${more ? '<div class="note"><b>Zillion needs more proof.</b><br>' + esc(info.staff_note) + '</div>' : ''}
    <label>New mobile number</label>
    <div class="row">
      <input id="newPhone" type="tel" inputmode="tel" placeholder="08012345678" value="${esc(info.new_phone)}">
      <button class="btn alt" id="otpBtn" onclick="sendCode()">Send code</button>
    </div>
    <label>Your email address</label>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
    <div class="sub" style="margin:-6px 0 10px;font-size:12px">We send the 6 digit code here, then use the new number for your wallet.</div>
    <label>6 digit code from the email</label>
    <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
    <label>Why is the number changing?</label>
    <textarea id="reason" maxlength="500" placeholder="e.g. My SIM was lost and I replaced it">${esc(info.reason)}</textarea>
    <label>Proof ${more ? '(add the new documents)' : '(optional, you can add it later if asked)'}</label>
    <input id="file" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" multiple>
    <div class="sub" style="margin:-6px 0 10px;font-size:12px">A police report, SIM replacement slip, network provider letter or ID. PDF or photo, up to 4MB each.</div>
    ${filesHtml()}
    <div id="m" class="msg"></div>
    <button class="btn" id="sendBtn" onclick="submitForm()">Send to Zillion</button>
  `);
  if (more && info.new_phone) $('otp').placeholder = 'Not needed again';
}

async function sendCode() {
  show('m', '');
  const phone = $('newPhone').value.trim();
  const email = $('email').value.trim();
  if (!phone) return show('m', 'Enter the new number first.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('m', 'Enter a valid email address. The code is sent there.');
  $('otpBtn').disabled = true;
  const r = await call(`${API}/send-otp`, 'POST', { phone, channel: 'email', email });
  $('otpBtn').disabled = false;
  if (!r.ok) return show('m', r.data.error || 'Could not send the code.');
  otpSent = true; otpPhone = phone;
  show('m', 'Code sent to your email. It is valid for 10 minutes. Check spam if you do not see it.', 'good');
}

function readB64(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(file); });
}

async function submitForm() {
  show('m', '');
  const btn = $('sendBtn'); btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const files = Array.from($('file').files || []);
    for (const f of files) {
      if (f.size > 4 * 1024 * 1024) throw new Error(f.name + ' is larger than 4MB.');
      const up = await call(`${API}/member-phone-change`, 'POST', { t: token, action: 'upload', file_name: f.name, mime_type: f.type, file_base64: await readB64(f) });
      if (!up.ok) throw new Error(up.data.error || 'A file could not be uploaded.');
    }
    if (files.length) { $('file').value = ''; info.proof = (info.proof || []).concat(files.map(f => ({ name: f.name }))); }
    const r = await call(`${API}/member-phone-change`, 'POST', {
      t: token, action: 'submit', new_phone: $('newPhone').value.trim(), otp: $('otp').value.trim(), reason: $('reason').value.trim(),
    });
    if (!r.ok) throw new Error(r.data.error || 'Could not send.');
    info.state = 'SUBMITTED'; render();
  } catch (e) {
    show('m', e.message || 'Something went wrong.');
    btn.disabled = false; btn.textContent = 'Send to Zillion';
  }
}
init();
</script>
</body>
</html>
