<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zillion Coop — Society Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0A2E1A;--amber:#F59E0B;--amber-d:#D97706;
  --cream:#F7F3EC;--muted:#C8BFA8;
  --green-mid:#1A5C32;--green-lt:#2D8A4E;
  --card:#0F3A22;--line:rgba(247,243,236,0.14);
  --red:#E85D5D;--redl:rgba(232,93,93,.14);
  --greenl:rgba(45,138,78,.16);
}
body{font-family:'Inter',sans-serif;background:var(--ink);color:var(--cream);min-height:100vh;line-height:1.5}
h1,h2,h3,.serif{font-family:'Fraunces',serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:10px;font-weight:600;font-size:14px;border:none;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--amber);color:var(--ink)}
.btn-primary:hover{background:#FFB020}
.btn-ghost{background:transparent;color:var(--cream);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn-danger{background:var(--redl);color:var(--red)}
.btn-sm{padding:7px 14px;font-size:12.5px}
input[type=text],input[type=tel],input[type=password],input[type=number]{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:var(--cream);font-size:14px}
label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.field{margin-bottom:14px}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{max-width:380px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 30px}
.login-logo{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-weight:900;font-size:20px;margin-bottom:6px}
.login-logo-mark{width:28px;height:28px;border-radius:7px;background:var(--amber);display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:900;font-size:13px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:26px}
#login-error{display:none;background:var(--redl);color:var(--red);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px}

/* APP SHELL */
#app-shell{display:none}
.topbar{position:sticky;top:0;z-index:50;background:rgba(10,46,26,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-logo{font-family:'Fraunces',serif;font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px}
.topbar-logo-mark{width:24px;height:24px;border-radius:6px;background:var(--amber);display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:900;font-size:11px}
.society-name{font-size:13px;color:var(--muted);padding-left:14px;border-left:1px solid var(--line)}
.trial-badge{background:var(--greenl);color:var(--green-lt);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.trial-badge.warn{background:rgba(245,158,11,.15);color:var(--amber)}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:14px 16px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--amber);border-bottom-color:var(--amber)}
.tab:hover{color:var(--cream)}
.view{max-width:1100px;margin:0 auto;padding:28px 24px 60px;display:none}
.view.active{display:block}

/* CARDS / METRICS */
.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.metric-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.metric-card .val{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--amber)}
.metric-card .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.card-title{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.card-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}

/* TABLES */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid rgba(247,243,236,.06)}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pill-green{background:var(--greenl);color:var(--green-lt)}
.pill-amber{background:rgba(245,158,11,.15);color:var(--amber)}
.pill-red{background:var(--redl);color:var(--red)}
.pill-muted{background:var(--line);color:var(--muted)}
.no-data{text-align:center;color:var(--muted);padding:30px;font-size:13px}
.loading-row{text-align:center;color:var(--muted);padding:30px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Fraunces',serif;font-size:19px;font-weight:700;margin-bottom:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 20px;font-size:13.5px;z-index:1001;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.error{border-color:var(--red);color:var(--red)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><span class="login-logo-mark">Z</span>Zillion Coop</div>
    <div class="login-sub">Society Portal — sign in with the phone and password you used to register.</div>
    <div id="login-error"></div>
    <div class="field">
      <label>Phone number</label>
      <input type="tel" id="li-phone" placeholder="08012345678">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="li-password" placeholder="Your password">
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()" id="li-btn">Sign in →</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-shell">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo"><span class="topbar-logo-mark">Z</span>Coop Portal</div>
      <div class="society-name" id="tb-society-name">—</div>
      <span class="trial-badge" id="tb-status-badge" style="display:none"></span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sign out</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-view="dashboard" onclick="switchView('dashboard')">Dashboard</div>
    <div class="tab" data-view="members" onclick="switchView('members')">Members</div>
    <div class="tab" data-view="savings" onclick="switchView('savings')">Savings</div>
    <div class="tab" data-view="loans" onclick="switchView('loans')">Loans</div>
  </div>

  <div class="view active" id="view-dashboard"></div>
  <div class="view" id="view-members"></div>
  <div class="view" id="view-savings"></div>
  <div class="view" id="view-loans"></div>
</div>

<!-- ACTIVATE MEMBER MODAL -->
<div class="modal-overlay" id="modal-activate">
  <div class="modal-box">
    <div class="modal-title">Activate a member</div>
    <div class="field"><label>Phone number</label><input type="tel" id="am-phone" placeholder="08012345678"></div>
    <div class="field"><label>Full name</label><input type="text" id="am-name" placeholder="e.g. Amina Bello"></div>
    <div class="field"><label>Opening balance (₦, optional)</label><input type="number" id="am-opening" placeholder="0"></div>
    <div id="am-error" style="display:none;color:#FF8A8A;font-size:13px;margin-bottom:12px"></div>
    <button class="btn btn-primary" style="width:100%" onclick="submitActivateMember()" id="am-btn">Activate member</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="closeModal('modal-activate')">Cancel</button>
  </div>
</div>

<!-- RECORD SAVINGS PAYMENT MODAL -->
<div class="modal-overlay" id="modal-savings-payment">
  <div class="modal-box">
    <div class="modal-title">Record a savings payment</div>
    <div id="sp-plan-label" style="font-size:13px;color:var(--muted);margin-bottom:14px"></div>
    <div class="field"><label>Amount (₦)</label><input type="number" id="sp-amount" placeholder="0"></div>
    <div class="field">
      <label>How was this paid?</label>
      <select id="sp-source" style="width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:var(--cream);font-size:14px" onchange="document.getElementById('sp-ref-field').style.display = this.value==='cash_in_person' ? '' : 'none'">
        <option value="bank_transfer_manual">Bank transfer</option>
        <option value="cash_in_person">Cash</option>
      </select>
    </div>
    <div class="field" id="sp-ref-field" style="display:none"><label>Reference (receipt no., etc.)</label><input type="text" id="sp-reference"></div>
    <div id="sp-error" style="display:none;color:#FF8A8A;font-size:13px;margin-bottom:12px"></div>
    <button class="btn btn-primary" style="width:100%" onclick="submitSavingsPayment()" id="sp-btn">Record payment</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="closeModal('modal-savings-payment')">Cancel</button>
  </div>
</div>

<!-- REJECT LOAN MODAL -->
<div class="modal-overlay" id="modal-reject-loan">
  <div class="modal-box">
    <div class="modal-title">Reject this loan</div>
    <div class="field"><label>Reason (optional)</label><input type="text" id="rl-reason" placeholder="e.g. Insufficient savings history"></div>
    <button class="btn btn-danger" style="width:100%" onclick="submitRejectLoan()" id="rl-btn">Reject loan</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="closeModal('modal-reject-loan')">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/v1';
let portalToken = localStorage.getItem('coop_portal_token') || '';
let portalData = null;
let currentView = 'dashboard';

function fmtNaira(kobo) { return '₦' + Math.round((kobo || 0) / 100).toLocaleString(); }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }

function notify(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4000);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── AUTH ──────────────────────────────────────────────────────────────
async function doLogin() {
  const phone = document.getElementById('li-phone').value.trim();
  const password = document.getElementById('li-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!phone || !password) { errEl.textContent = 'Enter your phone and password.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('li-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res = await fetch(`${API}/merchant-login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password }),
    });
    const data = await res.json();
    if (!res.ok || !data.token) {
      errEl.textContent = data.error || 'Sign in failed.'; errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign in →';
      return;
    }
    portalToken = data.token;
    localStorage.setItem('coop_portal_token', portalToken);
    await enterApp();
  } catch (e) {
    errEl.textContent = 'Network error: ' + e.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign in →';
  }
}

function doLogout() {
  localStorage.removeItem('coop_portal_token');
  portalToken = '';
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function enterApp() {
  const loaded = await loadPortalData();
  if (!loaded) return; // loadPortalData already shows the login screen + error on failure
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';
  switchView('dashboard');
}

async function loadPortalData() {
  try {
    const res = await fetch(`${API}/coop-portal-society`, { headers: { Authorization: 'Bearer ' + portalToken } });
    const data = await res.json();
    if (!res.ok) {
      const errEl = document.getElementById('login-error');
      errEl.textContent = data.error || 'Could not load your society — please sign in again.';
      errEl.style.display = 'block';
      doLogout();
      return false;
    }
    portalData = data;
    document.getElementById('tb-society-name').textContent = data.society.name;
    const badge = document.getElementById('tb-status-badge');
    const st = data.society.subscription_status;
    if (st === 'trial') {
      const days = data.society.trial_ends_at ? Math.max(0, Math.ceil((new Date(data.society.trial_ends_at) - new Date()) / 86400000)) : null;
      badge.textContent = days != null ? `Trial · ${days}d left` : 'Trial';
      badge.className = 'trial-badge' + (days != null && days <= 5 ? ' warn' : '');
      badge.style.display = '';
    } else if (st === 'trial_expired') {
      badge.textContent = 'Trial ended'; badge.className = 'trial-badge warn'; badge.style.display = '';
    } else if (st === 'active') {
      badge.textContent = 'Active'; badge.className = 'trial-badge'; badge.style.display = '';
    } else {
      badge.style.display = 'none';
    }
    return true;
  } catch (e) {
    notify('Failed to load: ' + e.message, true);
    return false;
  }
}

// ── VIEW SWITCHING ───────────────────────────────────────────────────
function switchView(name) {
  currentView = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  if (name === 'dashboard') renderDashboard();
  if (name === 'members') renderMembers();
  if (name === 'savings') renderSavings();
  if (name === 'loans') renderLoans();
}

async function refreshAndRender() {
  await loadPortalData();
  switchView(currentView);
}

// ── DASHBOARD ─────────────────────────────────────────────────────────
function renderDashboard() {
  const d = portalData;
  const el = document.getElementById('view-dashboard');
  const pendingLoans = d.loans.filter(l => l.status === 'PENDING_APPROVAL').length;
  const totalDuesOwing = d.members.reduce((s, m) => s + (m.dues?.owing_kobo || 0), 0);
  el.innerHTML = `
    <div class="metrics-row">
      <div class="metric-card"><div class="val">${d.metrics.active_members}</div><div class="lbl">Active members</div></div>
      <div class="metric-card"><div class="val">${fmtNaira(d.metrics.total_saved_kobo)}</div><div class="lbl">Total saved</div></div>
      <div class="metric-card"><div class="val">${fmtNaira(d.metrics.active_loans_kobo)}</div><div class="lbl">Outstanding on loans</div></div>
      <div class="metric-card"><div class="val">${fmtNaira(totalDuesOwing)}</div><div class="lbl">Dues owing</div></div>
    </div>
    ${pendingLoans > 0 ? `
    <div class="card" style="border-color:var(--amber)">
      <div class="card-title">⏳ ${pendingLoans} loan${pendingLoans === 1 ? '' : 's'} waiting for your review</div>
      <div class="card-sub">Members have applied for loans that need approval.</div>
      <button class="btn btn-primary btn-sm" onclick="switchView('loans')">Review loans →</button>
    </div>` : ''}
    <div class="card">
      <div class="card-title">Recent members</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Phone</th><th>Joined</th></tr></thead>
        <tbody>${d.members.slice(0, 5).map(m => `
          <tr><td>${m.name || '—'}</td><td>${m.phone_normalized}</td><td>${fmtDate(m.activated_at)}</td></tr>
        `).join('') || '<tr><td colspan="3" class="no-data">No members yet</td></tr>'}</tbody>
      </table></div>
    </div>
  `;
}

// ── MEMBERS ───────────────────────────────────────────────────────────
function renderMembers() {
  const d = portalData;
  const el = document.getElementById('view-members');
  el.innerHTML = `
    <div class="card">
      <div class="card-title">Members
        <button class="btn btn-primary btn-sm" onclick="openModal('modal-activate')">＋ Activate member</button>
      </div>
      <div class="card-sub">Members are existing (or future) Zillion wallet users you activate into your society.</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Phone</th><th>Joined</th><th>Dues owing</th><th>Status</th></tr></thead>
        <tbody>${d.members.map(m => `
          <tr>
            <td>${m.name || '—'}</td>
            <td>${m.phone_normalized}</td>
            <td>${fmtDate(m.activated_at)}</td>
            <td>${m.dues ? fmtNaira(m.dues.owing_kobo) : '<span class="pill pill-muted">No dues set</span>'}</td>
            <td><span class="pill ${m.status === 'ACTIVE' ? 'pill-green' : 'pill-muted'}">${m.status}</span></td>
          </tr>
        `).join('') || '<tr><td colspan="5" class="no-data">No members yet — activate your first one above.</td></tr>'}</tbody>
      </table></div>
    </div>
  `;
}

async function submitActivateMember() {
  const errEl = document.getElementById('am-error');
  errEl.style.display = 'none';
  const phone = document.getElementById('am-phone').value.trim();
  const name = document.getElementById('am-name').value.trim();
  const opening = parseInt(document.getElementById('am-opening').value) || 0;
  if (!phone) { errEl.textContent = 'Phone number is required.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('am-btn');
  btn.disabled = true; btn.textContent = 'Activating...';
  try {
    const res = await fetch(`${API}/coop-portal-activate-member`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + portalToken },
      body: JSON.stringify({ phone, name, opening_balance_kobo: opening * 100 }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Failed to activate member.'; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Activate member'; return; }
    notify(data.message || 'Member activated');
    closeModal('modal-activate');
    document.getElementById('am-phone').value = ''; document.getElementById('am-name').value = ''; document.getElementById('am-opening').value = '';
    btn.disabled = false; btn.textContent = 'Activate member';
    await refreshAndRender();
  } catch (e) {
    errEl.textContent = 'Network error: ' + e.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Activate member';
  }
}

// ── SAVINGS ───────────────────────────────────────────────────────────
let pendingSavingsPlanId = null;

function renderSavings() {
  const d = portalData;
  const el = document.getElementById('view-savings');
  el.innerHTML = `
    <div class="card">
      <div class="card-title">Savings plans</div>
      <div class="card-sub">Progress toward each member's savings target.</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Member</th><th>Target</th><th>Saved</th><th>Progress</th><th></th></tr></thead>
        <tbody>${d.savings_plans.map(p => `
          <tr>
            <td>${p.coop_members?.name || p.coop_members?.phone_normalized || '—'}</td>
            <td>${fmtNaira(p.target_amount_kobo)}</td>
            <td>${fmtNaira(p.saved_kobo)}</td>
            <td>${p.progress_pct}%</td>
            <td><button class="btn btn-ghost btn-sm" onclick="openSavingsPaymentModal('${p.id}','${(p.coop_members?.name || p.coop_members?.phone_normalized || '').replace(/'/g,"\\'")}')">Record payment</button></td>
          </tr>
        `).join('') || '<tr><td colspan="5" class="no-data">No savings plans yet.</td></tr>'}</tbody>
      </table></div>
    </div>
  `;
}

function openSavingsPaymentModal(planId, memberLabel) {
  pendingSavingsPlanId = planId;
  document.getElementById('sp-plan-label').textContent = `For: ${memberLabel}`;
  document.getElementById('sp-amount').value = '';
  document.getElementById('sp-reference').value = '';
  document.getElementById('sp-error').style.display = 'none';
  openModal('modal-savings-payment');
}

async function submitSavingsPayment() {
  const errEl = document.getElementById('sp-error');
  errEl.style.display = 'none';
  const amount = parseInt(document.getElementById('sp-amount').value) || 0;
  const source = document.getElementById('sp-source').value;
  const reference = document.getElementById('sp-reference').value.trim();
  if (amount <= 0) { errEl.textContent = 'Enter a valid amount.'; errEl.style.display = 'block'; return; }
  if (source === 'cash_in_person' && !reference) { errEl.textContent = 'A reference is required for cash payments.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('sp-btn');
  btn.disabled = true; btn.textContent = 'Recording...';
  try {
    const res = await fetch(`${API}/coop-portal-record-savings-payment`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + portalToken },
      body: JSON.stringify({ savings_plan_id: pendingSavingsPlanId, amount_kobo: amount * 100, source, reference }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Failed to record payment.'; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Record payment'; return; }
    notify('Payment recorded');
    closeModal('modal-savings-payment');
    btn.disabled = false; btn.textContent = 'Record payment';
    await refreshAndRender();
  } catch (e) {
    errEl.textContent = 'Network error: ' + e.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Record payment';
  }
}

// ── LOANS ─────────────────────────────────────────────────────────────
let pendingLoanId = null;

function loanStatusPill(status) {
  const map = { PENDING_APPROVAL: 'pill-amber', APPROVED: 'pill-green', DISBURSED: 'pill-green', REPAYING: 'pill-green', COMPLETED: 'pill-muted', REJECTED: 'pill-red' };
  return `<span class="pill ${map[status] || 'pill-muted'}">${status.replace(/_/g, ' ')}</span>`;
}

function renderLoans() {
  const d = portalData;
  const el = document.getElementById('view-loans');
  el.innerHTML = `
    <div class="card">
      <div class="card-title">Loans</div>
      <div class="card-sub">Applications, approvals, and repayment status.</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Borrower</th><th>Amount</th><th>Guarantor</th><th>Status</th><th>Outstanding</th><th></th></tr></thead>
        <tbody>${d.loans.map(l => `
          <tr>
            <td>${l.borrower?.name || l.borrower?.phone_normalized || '—'}</td>
            <td>${fmtNaira(l.principal_kobo)}</td>
            <td>${l.guarantor?.name || '—'}</td>
            <td>${loanStatusPill(l.status)}</td>
            <td>${l.repayment ? fmtNaira(l.repayment.outstanding_kobo) : '—'}</td>
            <td>${loanActionButtons(l)}</td>
          </tr>
        `).join('') || '<tr><td colspan="6" class="no-data">No loan applications yet.</td></tr>'}</tbody>
      </table></div>
    </div>
  `;
}

function loanActionButtons(l) {
  if (l.status === 'PENDING_APPROVAL') {
    return `<button class="btn btn-primary btn-sm" onclick="doLoanAction('${l.id}','approve')">Approve</button>
            <button class="btn btn-danger btn-sm" style="margin-left:6px" onclick="openRejectLoanModal('${l.id}')">Reject</button>`;
  }
  if (l.status === 'APPROVED') {
    return `<button class="btn btn-primary btn-sm" onclick="doLoanAction('${l.id}','disburse')">Mark disbursed</button>`;
  }
  return '';
}

async function doLoanAction(loanId, action, reason) {
  try {
    const res = await fetch(`${API}/coop-portal-loan-action`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + portalToken },
      body: JSON.stringify({ loan_id: loanId, action, reason }),
    });
    const data = await res.json();
    if (!res.ok) { notify(data.error || 'Action failed', true); return; }
    notify(`Loan ${action}d`);
    await refreshAndRender();
  } catch (e) { notify('Network error: ' + e.message, true); }
}

function openRejectLoanModal(loanId) {
  pendingLoanId = loanId;
  document.getElementById('rl-reason').value = '';
  openModal('modal-reject-loan');
}

async function submitRejectLoan() {
  const reason = document.getElementById('rl-reason').value.trim();
  closeModal('modal-reject-loan');
  await doLoanAction(pendingLoanId, 'reject', reason);
}

// ── BOOT ──────────────────────────────────────────────────────────────
(async function boot() {
  if (portalToken) {
    document.getElementById('login-screen').style.display = 'none';
    const loaded = await loadPortalData();
    if (loaded) {
      document.getElementById('app-shell').style.display = 'block';
      switchView('dashboard');
    } else {
      document.getElementById('login-screen').style.display = 'flex';
    }
  }
})();
</script>
